  // Language choice: saved choice, then browser language, else Macedonian.

    var l = 'mk'
    try { var n = (navigator.language || '').toLowerCase(); if (n.indexOf('en') === 0) l = 'en' } catch (e) {}
    var base = location.pathname.replace(/\/(index\.html)?$/, '')
    location.replace(base + '/' + l)
  })()
</script>
